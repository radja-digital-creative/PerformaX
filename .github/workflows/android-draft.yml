name: Android draft verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-draft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify backend account contracts
        run: node --experimental-transform-types tests/test_employee_account.mjs
      - name: Verify app tests and compile draft
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      # lib-performx integration tests access production; never run them in CI.
      # Do not publish a draft APK: required backend contracts are not deployed,
      # and the ephemeral runner's debug signer is not the installed APK signer.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-draft-test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
      - name: Explain release gate
        run: echo 'Draft compile only. Backend validation and the existing signing key are required before APK distribution.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve candidate for signing after backend verification
        uses: actions/upload-artifact@v4
        with:
          name: PerformaX-7.2.5-candidate-needs-existing-signer
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 3
      - name: Preserve SDK signing utility
        run: cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: android-sdk-signing-utility
          path: apksigner.jar
          retention-days: 3
